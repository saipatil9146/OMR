<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OMR</title>

    <style>
        body {
            font-family: Arial;
            margin: 20px;
        }

        .q {
            border: 1px solid #ccc;
            padding: 8px;
            margin: 6px;
            border-left: 8px solid red;
        }

        .q.attempt {
            border-left-color: green;
        }

        button {
            background: #3e5ce2;
            color: #fff;
            border: none;
            padding: 7px 17px;
            border-radius: 8px;
            cursor: pointer;
            margin: 5px;
        }

        .top {
            position: sticky;
            top: 0;
            background: #f9f7f7;
            padding: 10px;
            display: flex;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0, 0, 0, .2);
        }

        .modal {
            display: none;
            position: fixed;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, .6);
            z-index: 999;
        }

        .modal-content {
            background: #fff;
            width: 360px;
            max-width: 90%;
            margin: 8% auto;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
        }

        .close {
            float: right;
            font-size: 24px;
            cursor: pointer;
        }

        /* ===== NEW STYLE ===== */

        .opt {
            display: inline-block;
            margin: 3px;
        }

        .opt input {
            display: none;
        }

        .opt span {
            width: 34px;
            height: 34px;
            border: 2px solid #444;
            border-radius: 50%;
            display: inline-flex;
            justify-content: center;
            align-items: center;
            font-weight: bold;
            cursor: pointer;
            user-select: none;
        }

        .opt input:checked+span {
            background: #2196F3;
            color: white;
            border-color: #2196F3;
        }


        .password-overlay {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 9999
        }

        .password-box {
            background: #fff;
            padding: 20px;
            border-radius: 10px;
            width: 320px;
            text-align: center
        }

        .password-box input {
            width: 90%;
            padding: 10px;
            margin: 10px 0
        }


        .top {
            display: flex;
            flex-wrap: nowrap;
            align-items: center;
            justify-content: space-between;
            gap: 8px
        }

        .top>div,
        .bar {
            display: flex;
            align-items: center;
            gap: 6px;
            flex-wrap: nowrap
        }

        button {
            padding: 8px 12px;
            font-size: 16px
        }

        #s {
            width: 60px
        }

        .opt {
            display: inline-block;
            margin-right: 6px
        }

        .opt span {
            width: 50px;
            height: 50px;
            font-size: 22px
        }

        .opt:nth-child(4) {
            margin-right: 6px
        }

        @media(max-width:768px) {
            .top {
                flex-wrap: nowrap;


            }

            .top>div,
            .bar {
                flex-wrap: nowrap;

            }

            .q>div {
                display: flex !important;
                justify-content: space-between;
                align-items: center !important;
                flex-wrap: nowrap !important
            }

            .opt span {
                width: 32px;
                height: 32px;
                font-size: 20px
            }

            .opt {
                margin-right: 3px
            }

            .opt:nth-child(4) {
                margin-right: 3px
            }
        }
    </style>
</head>

<body>

    <div class="top">
        <div>
            Search Q:
            <input id="s" type="number" min="1" max="100">
            <button onclick="go()">Go</button>
        </div>

        <div class="bar">
            <button onclick="clr()">Submit</button>

        </div>

        <span id="res"></span>
    </div>

    <div id="c"></div>

    <div style="text-align:center; margin:30px 0;">
        <button onclick="historyView()">History</button>
        
    </div>

    <div id="resultModal" class="modal">
        <div class="modal-content">

            <span class="close" onclick="closeModal()">&times;</span>

            <h2>Test Result</h2>

            <p>Attempted : <b id="rAttempt"></b></p>

            <p>Right : <b id="rRight"></b></p>

            <p>Wrong : <b id="rWrong"></b></p>

            <p>Not Attempted : <b id="rNot"></b></p>

            <p>Accuracy : <b id="rAccuracy"></b></p>

            <button onclick="finalSubmit()">OK</button>

        </div>
    </div>

    <div id="clearModal" class="modal"><div class="modal-content"><h3>Student Name</h3><input type="text" id="studentName" placeholder="Enter Your Name" maxlength="10" style="width:90%;padding:12px;border:1px solid #ccc;border-radius:8px;margin:10px 0;"><br><button onclick="submitClear()">Submit</button><button onclick="closeClearModal()">Cancel</button></div></div>

<script>

        let st = JSON.parse(localStorage.omr || "{}");

        let c = document.getElementById("c");

        for (let i = 1; i <= 100; i++) {

            let d = document.createElement("div");

            d.className = "q";

            d.id = "q" + i;

            d.innerHTML = `
<div style="display:flex;justify-content:space-between;align-items:center;">
<div>
<b>Q${i}</b>
${[1, 2, 3, 4].map(v => `
<label class="opt"><input type="radio" name="a${i}" value="${v}"><span>${v}</span></label>
`).join("")}
</div>
<div>
<label class="opt"><input type="radio" name="r${i}" value="R"><span>✓</span></label>
<label class="opt"><input type="radio" name="r${i}" value="W"><span>✗</span></label>
</div>
</div>`;

            c.appendChild(d);

            d.querySelectorAll("input").forEach(inp => {

                if (st[inp.name] == inp.value) {
                    inp.checked = true;
                    inp.dataset.checked = "true";
                }


                inp.onclick = function () {

                    if (this.name.startsWith("r")) {
                        let qNo = this.name.substring(1);
                        let ans = document.querySelector('input[name="a' + qNo + '"]:checked');
                        if (!ans) {
                            alert("कृपया या प्रश्नाचे ऑप्शन टिक करा.");
                            this.checked = false;
                            return;
                        }
                    }


                    if (this.dataset.checked === "true") {
                        this.checked = false;
                        this.dataset.checked = "false";
                        delete st[this.name];
                        if (this.name.startsWith("a")) {
                            let qNo = this.name.substring(1);
                            document.querySelectorAll('input[name="r' + qNo + '"]').forEach(r => { r.checked = false; r.dataset.checked = "false"; });
                            delete st["r" + qNo];
                        }
                        localStorage.omr = JSON.stringify(st);
                        paint(i);
                        return;
                    }

                    document.querySelectorAll('input[name="' + this.name + '"]').forEach(r => r.dataset.checked = "false");
                    this.dataset.checked = "true";
                    st[this.name] = this.value;
                    localStorage.omr = JSON.stringify(st);
                    paint(i);
                };

            });

            paint(i);

        }

        function paint(i) {

            document.getElementById("q" + i).className =
                "q" + (st["a" + i] ? " attempt" : "");

        }

        function go() {

            let n = s.value;

            if (n)
                document.getElementById("q" + n).scrollIntoView();

        }


        let historyData = JSON.parse(localStorage.omrHistory || "[]");
        function saveHistory(name,a, r, w, not, acc) {
            historyData.unshift({ test: historyData.length + 1, name:name, date: new Date().toLocaleDateString('en-GB'), attempted: a, right: r, wrong: w, not: not, accuracy: acc + "%" });
            localStorage.omrHistory = JSON.stringify(historyData);
        }


        function historyView() {
            document.body.insertAdjacentHTML('beforeend', `<div class="password-overlay" id="pwdBox"><div class="password-box" style="position:relative;"><span onclick="document.getElementById('pwdBox').remove()" style="position:absolute;right:12px;top:8px;font-size:24px;cursor:pointer;">&times;</span><h3>History Login</h3><div style="position:relative;width:90%;max-width:260px;margin:10px auto;"><input type="password" id="hpwd" placeholder="Enter Password" style="width:100%;display:block;padding:10px;padding-right:45px;box-sizing:border-box;"><span onclick="let p=document.getElementById('hpwd');p.type=(p.type==='password')?'text':'password';this.innerHTML=(p.type==='password')?'👁':'🙈';" style="position:absolute;right:12px;top:50%;transform:translateY(-50%);cursor:pointer;font-size:20px;user-select:none;z-index:2;">👁</span></div><button onclick="checkHistoryPassword()">Open History</button><p id="perr" style="color:red"></p></div></div>`);
            document.getElementById('hpwd').addEventListener('keypress', function(e){
                if(e.key === 'Enter'){ checkHistoryPassword(); }
            });
        }
        function checkHistoryPassword() {
            if (document.getElementById('hpwd').value !== "9009") { document.getElementById('perr').innerText = "Wrong Password"; return; }
            document.getElementById('pwdBox').remove();
            let h = JSON.parse(localStorage.omrHistory || "[]");
            let html = '<div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:10px"><button onclick="location.reload()">← Back</button><div style="flex:1;text-align:center;font-size:28px;font-weight:bold">History</div><div style="width:90px"></div></div>';
            if (window.innerWidth <= 768) {
                h.forEach((x, i) => {
                    html += `<div style="max-width:420px;margin:15px auto;background:#fff;border-radius:16px;overflow:hidden;box-shadow:0 6px 18px rgba(0,0,0,.12);border:1px solid #e5e7eb">
<div style="background:linear-gradient(135deg,#4f8dfd,#6aa8ff);color:#fff;display:flex;justify-content:space-between;padding:14px 16px;font-weight:bold"><span>Test #${x.test}</span><span>${x.date}</span></div>
<div style="padding:16px;line-height:2">
<div>Name : <b>${x.name || "-"}</b></div><div>Attempted : <b>${x.attempted}</b></div><div>Right : <b>${x.right}</b></div><div>Wrong : <b>${x.wrong}</b></div><div>Not : <b>${x.not}</b></div><div>Accuracy : <b>${x.accuracy}</b></div></div>
<div style="padding:12px;text-align:right;background:#fafafa"><button onclick="deleteHistory(${i})">🗑 Delete</button></div></div>`
                });
            } else {
                html += `<table style="width:100%;border-collapse:collapse;font-family:Arial;box-shadow:0 4px 12px rgba(0,0,0,.12)"><tr style="background:#4f8dfd;color:#fff"><th>Test</th><th>Date</th><th>Attempted</th><th>Right</th><th>Wrong</th><th>Not</th><th>Accuracy</th><th>Action</th></tr>`;
                h.forEach((x, i) => html += `<tr><td>${x.test}</td><td>${x.date}</td><td>${x.attempted}</td><td>${x.right}</td><td>${x.wrong}</td><td>${x.not}</td><td>${x.accuracy}</td><td><button onclick="deleteHistory(${i})">Delete</button></td></tr>`);
                html += '</table>';
            }

            document.body.innerHTML = html;
        }

        function deleteHistory(i) {
            let h = JSON.parse(localStorage.omrHistory || "[]");
            h.splice(i, 1);
            h.forEach((e, idx) => e.test = idx + 1);
            localStorage.omrHistory = JSON.stringify(h);
            historyView();
        }


        function calc() {

            let a = 0, r = 0, w = 0;

            for (let i = 1; i <= 100; i++) {

                if (st["a" + i]) a++;

                if (st["r" + i] == "R") r++;

                if (st["r" + i] == "W") w++;

            }

            let not = 100 - a;

            let acc = a ? ((r / a) * 100).toFixed(2) : 0;

            rAttempt.innerText = a;

            rRight.innerText = r;

            rWrong.innerText = w;

            rNot.innerText = not;

            rAccuracy.innerText = acc + "%";


            resultModal.style.display = "block";

        }

        function closeModal() {

            resultModal.style.display = "none";

        }

        window.onclick = function (e) {

            if (e.target == resultModal)

                closeModal();

        }

        function clr(){
let incompleteQuestions=[];
for(let i=1;i<=100;i++){
 if(st["a"+i] && !st["r"+i]) incompleteQuestions.push(i);
}
if(incompleteQuestions.length>0){
 alert("तुम्ही खालील प्रश्नांचे Right (✓) किंवा Wrong (✗) निवडलेले नाही:\n\nQ"+incompleteQuestions.join(", Q"));
 return;
}
document.getElementById("clearModal").style.display="block";
}
function closeClearModal(){document.getElementById("clearModal").style.display="none";}
let pendingResult=null;
function submitClear(){let name=document.getElementById("studentName").value.trim(); if(!name){alert("Please Enter Your Name");return;} if(name.length<3){alert("Name must be at least 3 characters");return;} if(name.length>10){alert("Name must be maximum 10 characters");return;} let a=0,r=0,w=0; for(let i=1;i<=100;i++){if(st["a"+i])a++; if(st["r"+i]=="R")r++; if(st["r"+i]=="W")w++;} let not=100-a; let acc=a?((r/a)*100).toFixed(2):0; pendingResult={name,a,r,w,not,acc}; closeClearModal(); rAttempt.innerText=a; rRight.innerText=r; rWrong.innerText=w; rNot.innerText=not; rAccuracy.innerText=acc+"%"; resultModal.style.display="block";}
function finalSubmit(){ if(pendingResult){ saveHistory(pendingResult.name,pendingResult.a,pendingResult.r,pendingResult.w,pendingResult.not,pendingResult.acc);} localStorage.removeItem("omr"); location.reload(); }

    
document.addEventListener('DOMContentLoaded',function(){
 const studentInput=document.getElementById('studentName');
 if(studentInput){
   studentInput.addEventListener('keypress',function(e){
     if(e.key==='Enter'){
       e.preventDefault();
       submitClear();
     }
   });
 }
});

</script>

</body>

</html>
